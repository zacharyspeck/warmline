<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=320, initial-scale=1" />
    <style>
      :root {
        --amber: #e5813b;
        --charcoal: #1b1613;
        --card: #241d18;
        --ink: #f3ebe1;
        --muted: #b5a28e;
        --border: rgba(243, 235, 225, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 320px;
        background: var(--charcoal);
        color: var(--ink);
        font-family:
          ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
        font-size: 13px;
      }
      .wrap {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 15px;
      }
      .brand .dot {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--amber);
        display: inline-block;
      }
      label {
        display: block;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--ink);
        font-size: 12px;
        font-family: inherit;
      }
      input::placeholder {
        color: rgba(181, 162, 142, 0.6);
      }
      .field {
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        border-radius: 9px;
        border: none;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .primary {
        background: var(--amber);
        color: var(--charcoal);
      }
      .ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .status {
        font-size: 12px;
        line-height: 1.4;
        min-height: 16px;
      }
      .status.ok {
        color: #7fd6a2;
      }
      .status.err {
        color: #f0a58a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="dot"></span> Warmline</div>

      <div class="card">
        <div class="field">
          <label for="serverUrl">Server URL</label>
          <input
            id="serverUrl"
            type="text"
            placeholder="https://your-id.convex.site"
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label for="token">Token (from Settings)</label>
          <input
            id="token"
            type="password"
            placeholder="wl_…"
            autocomplete="off"
          />
        </div>
        <button id="saveBtn" class="ghost">Save connection</button>
        <div
          id="connState"
          class="muted"
          style="margin-top: 8px; font-size: 11.5px"
        ></div>
      </div>

      <button id="captureBtn" class="primary">Capture this profile</button>
      <button id="captureResultsBtn" class="primary" style="display: none">
        Capture mutuals shown
      </button>
      <div id="status" class="status muted">
        Open a LinkedIn profile, then click Capture
      </div>
      <div id="diag" class="muted" style="font-size: 11px; line-height: 1.4"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
